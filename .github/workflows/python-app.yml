name: Coin Radar Gecmis Veri Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Bes gunluk veri testi
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          url = "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=try&days=5"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "MuratHocaRadar/1.0"}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)

              prices = data.get("prices", [])
              volumes = data.get("total_volumes", [])

              print("FIYAT KAYDI:", len(prices))
              print("HACIM KAYDI:", len(volumes))

              if prices:
                  print("ILK ZAMAN:", prices[0][0])
                  print("SON ZAMAN:", prices[-1][0])

              if len(prices) >= 100:
                  print("100 KAYIT MEVCUT")
              else:
                  print("100 KAYIT YOK")

          except urllib.error.HTTPError as e:
              print("HTTP HATASI:", e.code)
              raise
          PY
