name: CoinGecko Fiyat Verisi Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Saatlik fiyat ve hacim testi
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          url = (
              "https://api.coingecko.com/api/v3/coins/"
              "bitcoin/market_chart?vs_currency=try&days=2"
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "MuratHocaRadar/1.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

              prices = data.get("prices", [])
              volumes = data.get("total_volumes", [])

              print("FIYAT VERISI SAYISI:", len(prices))
              print("HACIM VERISI SAYISI:", len(volumes))

              if prices:
                  print("SON FIYAT TL:", prices[-1][1])

              if len(prices) >= 40 and len(volumes) >= 40:
                  print("VERI TESTI BASARILI")
              else:
                  print("YETERSIZ GECMIS VERI")

          except Exception as error:
              print("TEST HATASI:", error)
              raise
          PY
